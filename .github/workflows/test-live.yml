name: Test GPT-Live bridge
on:
  pull_request:
  push:
    branches: [main, gpt-live-redesign]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libspeexdsp1
      - name: Verify pinned native AirPlay sender
        run: |
          curl -fLsS --retry 3 --max-time 120 https://github.com/music-assistant/airplay-cli/releases/download/v0.5.9/cliairplay-linux-x86_64 -o "$RUNNER_TEMP/cliairplay"
          echo "affa85c5b3edff370f7c08f921d6a3095444acbc10579a3d12713e3b1ebe0425  $RUNNER_TEMP/cliairplay" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/cliairplay"
          "$RUNNER_TEMP/cliairplay" --check
          echo "AIRPLAY_TEST_BINARY=$RUNNER_TEMP/cliairplay" >> "$GITHUB_ENV"
      - run: pip install ./openai_realtime_voice_agent pyyaml
      - run: python -m unittest discover -s openai_realtime_voice_agent/tests -v
