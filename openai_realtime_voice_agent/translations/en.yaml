configuration:
  openai_api_key:
    name: OpenAI API key
    description: Project key with GPT-Live and your chosen Responses backend enabled. Kept in the add-on;
      never sent to the Voice PE or speaker.
  instructions:
    name: Voice personality
    description: GPT-Live conversation prompt. Keep the Backchannel, Interruption and Delegation policies,
      including Generate <|SpawnThinking|> for device/tool requests. Edit as YAML for multiple lines.
  backend_instructions:
    name: Reasoning and device-control instructions
    description: Task rules for the separate Responses backend. Describe how to use Home Assistant tools
      and report failures accurately. Voice style belongs in Voice personality.
  opening_greeting:
    name: Opening greeting
    description: GPT-Live is asked to speak this once after each wake, then listen. Empty disables the
      greeting. It may paraphrase or stay silent; this is live generation, not a prerecorded clip.
  greeting_language:
    name: Greeting language
    description: Language used for the opening greeting before the user has spoken, for example English.
  openai_voice:
    name: Live voice
    description: A supported GPT-Live voice name, for example cedar, marin or quartz. Takes effect on
      the next conversation.
  backend_model:
    name: Reasoning backend model
    description: Responses model for device control and reasoning, separate from gpt-live-1. Default gpt-6-luna;
      choose a model your API project can access.
  backend_reasoning_effort:
    name: Backend reasoning effort
    description: Use low for quick routine controls, or default to omit the setting. Supported values
      depend on the backend model.
  backend_max_output_tokens:
    name: Backend output limit
    description: Maximum tokens for backend reasoning and tool results. Too low can prevent a tool workflow
      completing.
  backend_parallel_tools:
    name: Parallel backend tools
    description: Allow independent tool calls together. Off runs tool calls sequentially; failed mutations
      are never automatically retried.
  enable_web_search:
    name: Web search
    description: Give the Responses backend hosted web search. Charged separately from voice; no separate
      search-model setting.
  websocket_port:
    name: Voice PE device port
    description: Keep your working port, for example 18081. Must match the device va_url. The add-on does
      not change it automatically.
  ha_mcp_url:
    name: Home Assistant MCP address
    description: Empty uses the built-in MCP Server at supervisor/core/api/mcp. Only entities exposed
      to Assist are available.
  longlived_token:
    name: Home Assistant access token
    description: 'Normally empty: uses the existing SUPERVISOR_TOKEN. Only needed for a custom MCP server
      or installation without Supervisor permissions.'
  mcp_tool_allowlist:
    name: Allowed HA tools
    description: Comma-separated exact tool names. Empty keeps all tools already exposed by your MCP server.
      Does not expand Assist entity permissions.
  mcp_preload_context:
    name: Preload device names
    description: Read Assist device context once at add-on startup. Known names go directly to control
      tools, with no catalogue request before every command.
  tts_output:
    name: Speech output
    description: voice_pe uses continuous PCM; media_player uses one continuous MP3-over-HTTP stream per
      conversation, including silence. No per-phrase playback requests or wake chimes.
  tts_media_player:
    name: Speech media player
    description: Exact entity ID, for example media_player.living_room_speakers. Used only for media_player
      output.
  tts_announce:
    name: Request conversation announcement
    description: Request announcement mode once for the whole conversation. Music stays interrupted through
      quiet gaps. Source restoration depends on the player integration; Spotify Connect auto-resume remains
      unsupported.
  tts_stream_base_url:
    name: Audio HTTP address
    description: Speaker-reachable LAN base URL, for example http://192.168.1.100:18082. Required for
      external output. Replace the IP with your HA host and keep this port on the LAN.
  tts_stream_port:
    name: Audio HTTP port
    description: Free port for temporary MP3 streams, default 18082. Must match Audio HTTP address and
      differ from the Voice PE device port.
  tts_stream_prebuffer_ms:
    name: Initial speaker stream prebuffer (ms)
    description: MP3 collected once at wake before requesting playback. Default 120. This does not repeat
      between phrases. Reduce for quicker startup; raise for stuttering.
  tts_stream_start_timeout_s:
    name: Speaker fetch timeout (seconds)
    description: Maximum wait for the speaker to fetch the conversation stream. A failure timeout, not
      an added turn-taking delay.
  tts_start_allowance_ms:
    name: Gated microphone playback allowance (ms)
    description: Estimate of speaker buffering beyond the generated audio clock. Used only to time gated
      microphone reopening; full_duplex input never waits for this.
  playback_prebuffer_ms:
    name: Voice PE jitter buffer (ms)
    description: Device-local PCM cushion. Default 100; affects Voice PE output only. New firmware reads
      this on reconnect.
  microphone_mode:
    name: Microphone mode
    description: full_duplex keeps the mic open throughout speech and pauses. For external speakers, calibrate
      the playback delay to enable reference-based software AEC. gated optionally closes the mic during
      speech activity.
  mic_reopen_delay_ms:
    name: Gated microphone echo guard (ms)
    description: Extra echo decay before reopening a gated mic. Ignored in full_duplex mode; no input
      audio is cleared between replies in that mode.
  output_silence_ms:
    name: Speech activity quiet period (ms)
    description: Quiet audio before LEDs return to listening and a gated mic may reopen. Default 350.
      This never closes or restarts the conversation stream.
  output_silence_threshold_db:
    name: Speech activity threshold (dBFS)
    description: Audio quieter than this counts as silence for LEDs, gated input and idle detection. Default
      -55. It does not cut speech or split the HTTP stream.
  input_activity_threshold_db:
    name: Input activity threshold (dBFS)
    description: Microphone level after active echo cancellation that refreshes the conversation idle
      timer. Default -42. Raise for room noise or lower for quiet voices. This does not control GPT-Live
      turn detection.
  input_buffer_ms:
    name: Startup microphone buffer (ms)
    description: Bounded capture while connecting to Live. Default 600. Increase if immediate words are
      lost during slow startup; excess oldest audio is dropped and counted in logs.
  idle_timeout_seconds:
    name: Conversation idle timeout (seconds)
    description: Close the paid Live session after this much quiet, once playback and backend work are
      finished. Default 15. A socket to the Voice PE can remain connected without Live billing.
  max_session_seconds:
    name: Maximum conversation (seconds)
    description: Hard limit on a paid session, even if background noise keeps it active. Default 180;
      wake again to start another.
  session_start_timeout_s:
    name: Live connection timeout (seconds)
    description: Failure limit while starting Live. Audio capture starts on wake and is bounded by Startup
      microphone buffer.
  session_close_timeout_s:
    name: Live close timeout (seconds)
    description: Wait briefly for session.closed and final usage on normal idle closure. A forced disconnect
      can leave final usage unconfirmed.
  greeting_timeout_s:
    name: Greeting diagnostic timeout (seconds)
    description: Log if no audible greeting arrives by this time. The microphone remains available; the
      app does not replay or repeatedly request a greeting.
  tool_timeout_s:
    name: Home Assistant tool timeout (seconds)
    description: Limit for MCP discovery and each call. A failed action may have an unknown outcome; it
      is never blindly retried.
  log_transcripts:
    name: Log conversation transcripts
    description: Off by default. Enable only when needed for troubleshooting; user and assistant text
      will appear in add-on logs.
  tts_stream_buffer_seconds:
    name: HTTP stream memory window (seconds)
    description: Bounded rolling MP3 buffer for network readers, default 5 seconds. This is a capacity,
      not an intentional playback delay. Reconnects join the live edge instead of replaying prior replies.
  output_buffer_ms:
    name: Output queue limit (ms)
    description: Maximum queued Live PCM during startup or network bursts, default 3000. Does not wait
      to fill. Exceeding the spoken-audio limit fails the session instead of accumulating stale delayed
      speech.
  aec_enabled:
    name: External speaker echo cancellation
    description: Use local SpeexDSP AEC before microphone audio reaches GPT-Live. Applies to media_player
      output. Requires a measured or manually set delay; without one, logs that input passes through unchanged.
      Does not close the microphone.
  aec_delay_ms:
    name: Speaker echo delay (ms)
    description: "-1 uses the saved calibration for this speaker, microphone address and stream settings.\
      \ Set 0\u201310000 to override manually. Positive values mean speaker audio reaches the microphone\
      \ later than the outgoing reference. This aligns a reference; it does not delay microphone delivery\
      \ by that amount."
  aec_auto_delay:
    name: Track echo delay drift
    description: Refine alignment slowly during strongly correlated speaker audio to follow small buffering
      and independent-clock changes. Rejects weak matches during user speech. Recalibrate after large
      player/source/group changes.
  aec_delay_search_ms:
    name: Delay tracking search radius (ms)
    description: Look this far either side of the current echo delay when tracking, default 80. Does not
      add latency. Large changes outside the window need calibration.
  aec_alignment_margin_ms:
    name: AEC alignment headroom (ms)
    description: Let the adaptive filter see the reference this much before its echo, default 20 ms. This
      is subtracted internally from the measured bulk delay; do not subtract it from your measurement.
      Must fit inside the filter tail.
  aec_filter_ms:
    name: Room echo filter tail (ms)
    description: Adaptive room-response length after aligning the main playback delay, default 256 ms.
      Raise cautiously for long reflections; longer filters use more CPU and converge more slowly. This
      is not the full WiiM playback delay.
  aec_suppression_db:
    name: Residual echo suppression (dB)
    description: Maximum additional attenuation of remaining echo when the assistant is speaking, default
      -25 dB. More negative is stronger. 0 disables this residual suppression, retaining adaptive cancellation.
  aec_suppression_active_db:
    name: Residual suppression while you speak (dB)
    description: Maximum residual suppression during simultaneous user/assistant speech, default -8 dB.
      Move toward 0 if your voice becomes thin or clipped; stronger negative values may suppress more
      remaining echo.
  aec_log_stats:
    name: Log AEC tuning measurements
    description: Log effective delay and microphone RMS levels every five seconds. Levels may include
      your voice and are not an echo-only quality measurement. No audio recordings or transcripts are
      written.
  aec_calibrate_on_next_wake:
    name: Measure echo delay on next wake
    description: 'Enable, save and restart, then say Hey Jarvis and keep quiet. The next wake plays three
      short test sweeps through the normal continuous speaker stream. No OpenAI connection is made for
      this test. A clear measurement is saved for aec_delay_ms: -1; later wakes are normal conversations.
      Turn this off before future restarts unless another test is wanted.'
  playback_diagnostic_on_next_wake:
    name: Compare playback paths on next wake
    description: Run one local diagnostic with the external speaker, an HTTP/MP3 software decoder,
      then the Voice PE speaker. Six tones total; keep quiet. No OpenAI connection is made and no
      AEC calibration is saved. Turn regular calibration off when using this, and turn this off
      before future restarts. Local hardware AEC may make the Voice PE result unavailable.
  aec_calibration_max_delay_ms:
    name: Calibration delay search limit (ms)
    description: Maximum speaker-to-microphone delay to search, default 5000 ms. The test listens this
      long after the sweeps. Raise if a high-latency speaker is outside the search range.
  aec_calibration_min_confidence:
    name: Calibration minimum correlation
    description: Minimum spectral match for the complete probe and each of its three sweeps, default
      0.35. Keep quiet and use comfortable speaker volume. Waveform correlation alone may be low with
      independent clocks. Ambiguous, inconsistent and clipped captures are also rejected.
  aec_calibration_level:
    name: Calibration test level
    description: Digital peak level of the soft-edged test sweeps, default 0.15. Does not change the WiiM
      volume. Raise gently if the microphone cannot hear the test; reduce if it clips.
