  tts_stream_base_url: str
  tts_stream_port: port
  tts_stream_prebuffer_ms: int(0,3000)
  tts_stream_start_timeout_s: float(1,30)
  tts_start_allowance_ms: int(0,5000)
  playback_prebuffer_ms: int(0,2000)
  microphone_mode: list(gated|full_duplex)
  mic_reopen_delay_ms: int(0,5000)
  output_silence_ms: int(100,3000)
  output_silence_threshold_db: float(-90,-10)
  input_activity_threshold_db: float(-90,-10)
  input_buffer_ms: int(100,3000)
